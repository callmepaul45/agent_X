<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurex Autos - Menu</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                🏎️ Aurex<span>Autos</span>
            </a>
            <ul class="nav-menu" id="navMenu">                
                <li class="nav-item"><a href="#">Inventory</a></li>
                <li class="nav-item"><a href="#">Buy</a></li>
                <li class="nav-item"><a href="#">Sell</a></li>                
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </nav>
    </header>

    <section class="search-section">
        <form class="search-container" id="searchForm" onsubmit="handleSearch(event)">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by car keyword (e.g. Civic, SUV, Red)...">
            
            <select class="filter-select" id="makeFilter">
                <option value="">All Makes</option>
                <option value="toyota">Toyota</option>
                <option value="honda">Honda</option>
                <option value="ford">Ford</option>
                <option value="bmw">BMW</option>
                <option value="audi">Audi</option>
            </select>

            <select class="filter-select" id="priceFilter">
                <option value="">Price Range</option>
                <option value="under10k">Under $10,000</option>
                <option value="10k-25k">$10,000 - $25,000</option>
                <option value="25k-50k">$25,000 - $50,000</option>
                <option value="over50k">Over $50,000</option>
            </select>

            <button type="submit" class="search-btn">Search</button>
        </form>
    </section>

    <main class="content">
        <div class="hero-banner">
            <h1>Find Your Dream Car Today</h1>
            <p>Explore thousands of quality new and pre-owned vehicles at competitive prices.</p>
        </div>
    </main>
    <main class="car-grid" id="carGrid">
        <!-- Car cards dynamically generated by JavaScript -->
    </main>
    <script src="menu.js"></script>
</body>
</html>
